name: Stoa
options:
  bundleIdPrefix: com.conradclose
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
packages:
  Stoa:
    path: .
targets:
  Stoa:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: Stoa
        product: StoaCore
      - package: Stoa
        product: StoaWeb
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Stoa
        CFBundleName: Stoa
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "© 2026 Conrad Close. MIT License."
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleURLTypes:
          - CFBundleURLName: Web URLs
            CFBundleURLSchemes: [http, https]
    entitlements:
      path: App/Stoa.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.conradclose.stoa
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
schemes:
  Stoa:
    build:
      targets:
        Stoa: all
    run:
      config: Debug
