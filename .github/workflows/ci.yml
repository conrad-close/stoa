name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || true; xcodebuild -version
      - name: Package tests (StoaCore)
        run: swift test --parallel
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build app (unsigned)
        run: |
          xcodebuild -project Stoa.xcodeproj -scheme Stoa -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
